name: RC7 Remediation Audit

on:
  push:
    branches:
      - 'hardening/rc7-audit-remediation'
    paths:
      - '.github/workflows/rc7-remediation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inventory duplicate content and references
        shell: bash
        run: |
          {
            python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          groups = {}
          for raw in tracked:
              if not raw:
                  continue
              p = Path(raw.decode())
              if not p.is_file() or p.is_symlink():
                  continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              groups.setdefault(h, []).append(p.as_posix())
          print('=== BYTE DUPLICATE GROUPS ===')
          for h, paths in sorted(groups.items()):
              if len(paths) > 1:
                  print(h, *paths, sep='\n  ')
          PY
            echo '=== REFERENCES ==='
            for needle in \
              'CCBSN-build-plan.json' \
              'CCBSN-configured-ir.json' \
              'CCBSN-extracted-ir.json' \
              'compile_runner' \
              'mql5-compile-runner' \
              'Resolve-MetaEditor' \
              'WarmStdlib' \
              'InstallerUrl'; do
              echo "--- $needle ---"
              git grep -n -I -F "$needle" -- . ':!REPO-MANIFEST.sha256' ':!SHA256SUMS.txt' || true
            done
            echo '=== BASELINE HYGIENE ==='
            python scripts/maintenance/check_rc6_hygiene.py || true
            echo '=== BASELINE MANIFEST ==='
            python scripts/maintenance/repo_manifest.py --check || true
          } > rc7-remediation-inventory.txt 2>&1
          cat rc7-remediation-inventory.txt
      - uses: actions/upload-artifact@v6
        with:
          name: rc7-remediation-inventory
          path: rc7-remediation-inventory.txt
          if-no-files-found: error
