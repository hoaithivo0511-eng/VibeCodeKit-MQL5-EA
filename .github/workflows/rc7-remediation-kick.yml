name: RC7 Remediation Kick

on:
  push:
    branches: ['hardening/rc7-audit-remediation']
    paths: ['.github/workflows/rc7-remediation-kick.yml']

permissions:
  contents: write

jobs:
  patch-ordering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: hardening/rc7-audit-remediation
      - name: Fix remediation executor ordering and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/rc7-remediation-apply.yml')
          t = p.read_text(encoding='utf-8')
          old = "          # Self-remove the temporary remediation executor before hygiene/manifest evaluation.\n          git rm -f .github/workflows/rc7-remediation-apply.yml\n\n          python scripts/maintenance/check_rc6_hygiene.py\n"
          new = "          # Self-remove the temporary remediation executor before hygiene/manifest evaluation.\n          git rm -f .github/workflows/rc7-remediation-apply.yml\n          # New required maintenance policy must be tracked before hygiene inspects git ls-files.\n          git add scripts/maintenance/check_duplicate_content.py\n\n          python scripts/maintenance/check_rc6_hygiene.py\n"
          if old not in t:
              raise SystemExit('ordering anchor not found in remediation executor')
          p.write_text(t.replace(old, new), encoding='utf-8')
          PY
          git rm -f .github/workflows/rc7-remediation-kick.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rc7-remediation-apply.yml
          git commit -m 'fix(rc7): order remediation hygiene after tracking new policy'
          git push origin HEAD:hardening/rc7-audit-remediation
