name: RC7 Final Sync After Test

on:
  push:
    branches:
      - 'audit/rc7-full-e2e-docs-sync'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/rc7-full-e2e-docs-sync
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Focused truth and hygiene regression
        run: |
          python -m pip install './tool/source[dev]'
          cd tool/source
          python -m pytest -q \
            tests/test_phase33_rc6_hygiene.py \
            tests/test_phase33_github_compile_backend.py \
            tests/test_phase38_rc7_full_e2e_truth.py
          cd ../..
          python scripts/maintenance/check_rc6_hygiene.py
          python scripts/maintenance/check_duplicate_content.py
      - name: Sync installed-wheel mirror and exact manifest
        run: |
          python scripts/maintenance/sync_distribution_snapshot.py sync
          git rm .github/workflows/rc7-final-sync-after-test.yml
          git add tool/source/scripts/vibecodekit_mql5/resources/distribution
          python scripts/maintenance/repo_manifest.py --write
          git add REPO-MANIFEST.sha256
          python scripts/maintenance/repo_manifest.py --check
      - name: Commit clean final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(audit): sync version-aware hygiene regression"
          git push
