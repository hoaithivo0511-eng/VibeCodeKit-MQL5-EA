name: RC7 Remediation Apply

on:
  push:
    branches: ['hardening/rc7-audit-remediation']
    paths: ['.github/workflows/rc7-remediation-apply.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply cleanup, consolidation, hygiene and docs fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/rc7-demo-native-compile.yml \
            .github/workflows/rc7-final-native-compile-demo.yml \
            demo/rc7/Experts/RC7CompileDemo.mq5 \
            demo/final/Experts/RC7FinalCompileDemo.mq5 \
            .github/workflows/rc7-remediation-audit.yml

          cat > scripts/maintenance/check_duplicate_content.py <<'PY'
          #!/usr/bin/env python3
          """Fail closed on unclassified byte-identical tracked files.

          Intentional mirrors (packaged resources), self-contained acceptance fixtures,
          frozen historical bundle inputs/evidence and the Windows worker handoff are
          explicit policy exceptions. New duplicate groups outside those boundaries fail.
          """
          from __future__ import annotations
          import hashlib
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]

          def tracked_files() -> list[Path]:
              raw = subprocess.check_output(["git", "ls-files", "-z"], cwd=ROOT)
              return [ROOT / item.decode() for item in raw.split(b"\0") if item]

          def allowed(paths: list[str]) -> tuple[bool, str]:
              s = set(paths)
              # Installed-wheel/package resource mirrors are intentionally byte-exact.
              if any("tool/source/scripts/vibecodekit_mql5/resources/" in p for p in paths) and all(p.startswith("tool/source/") for p in paths):
                  return True, "packaged-resource-mirror"
              # Cross-project fixtures are deliberately self-contained copies used to prove generic behavior.
              if all(p.startswith("demo/CCBSN_GoldenFixture/") or p.startswith("demo/generic-acceptance/") for p in paths):
                  return True, "self-contained-acceptance-fixtures"
              # Frozen RC4-era root CCBSN inputs remain bound by BUNDLE-MANIFEST.json.
              frozen = {
                  "demo/CCBSN-build-plan.json",
                  "demo/CCBSN-configured-ir.json",
                  "demo/CCBSN_GoldenFixture/BUILD-PLAN.json",
                  "demo/CCBSN_GoldenFixture/EA-IR.json",
              }
              if s <= frozen and len(s) > 1:
                  return True, "frozen-bundle-input"
              # Historical reports are immutable audit evidence, including legacy dual-format exports.
              if all(p.startswith("reports/") for p in paths):
                  return True, "historical-report-evidence"
              # Windows worker source and native handoff copy are intentionally parity-checked.
              if s == {"native/workers-windows/run_compile.ps1", "tool/source/workers/windows/run_compile.ps1"}:
                  return True, "native-worker-handoff"
              # License is intentionally reproduced inside the package source.
              if all(Path(p).name == "LICENSE" for p in paths):
                  return True, "license-copy"
              return False, ""

          def evaluate() -> list[tuple[str, list[str]]]:
              groups: dict[str, list[str]] = defaultdict(list)
              for path in tracked_files():
                  if not path.is_file() or path.is_symlink() or path.stat().st_size == 0:
                      continue
                  rel = path.relative_to(ROOT).as_posix()
                  groups[hashlib.sha256(path.read_bytes()).hexdigest()].append(rel)
              bad = []
              for digest, paths in sorted(groups.items()):
                  if len(paths) < 2:
                      continue
                  ok, _ = allowed(paths)
                  if not ok:
                      bad.append((digest, paths))
              return bad

          def main() -> int:
              bad = evaluate()
              if bad:
                  print("duplicate content policy: FAIL")
                  for digest, paths in bad:
                      print(digest)
                      for path in paths:
                          print(f"  {path}")
                  return 1
              print("duplicate content policy: PASS")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x scripts/maintenance/check_duplicate_content.py

          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p=Path(path); old=p.read_text(encoding='utf-8'); new=fn(old)
              if new == old: raise SystemExit(f'expected edit produced no change: {path}')
              p.write_text(new, encoding='utf-8')

          # Native action runner: preparation belongs exclusively to Prepare-VKMql5Toolchain.ps1.
          def fix_invoke(t):
              for line in ['  [string]$InstallerUrl = "",\n','  [string]$InstallerSha256 = "",\n','  [ValidateSet("auto","always","never")][string]$WarmStdlib = "auto",\n']:
                  t=t.replace(line,'')
              t=re.sub(r'function Assert-SafeHttpsUrl\(\[string\]\$Url\) \{.*?\nfunction Copy-NormalizedTree', 'function Copy-NormalizedTree', t, flags=re.S)
              old='''  $resolvedMeta = Resolve-MetaEditor $MetaEditor $InstallerUrl $InstallerSha256\n  $metaPath = [string]$resolvedMeta.path\n  $metaInfo.path = $metaPath\n  $metaInfo.installer_sha256 = [string]$resolvedMeta.installer_sha256\n  $metaInfo.version = [string](Get-Item -LiteralPath $metaPath).VersionInfo.FileVersion\n'''
              new='''  if (-not $MetaEditor) { throw "TOOLCHAIN_INSTALL_FAILED: prepared MetaEditor path is required" }\n  $resolvedMeta = Resolve-Path -LiteralPath $MetaEditor -ErrorAction SilentlyContinue\n  if (-not $resolvedMeta) { throw "TOOLCHAIN_INSTALL_FAILED: prepared MetaEditor path not found: $MetaEditor" }\n  $metaPath = [string]$resolvedMeta.Path\n  $metaInfo.path = $metaPath\n  $metaInfo.installer_sha256 = ""\n  $metaInfo.version = [string](Get-Item -LiteralPath $metaPath).VersionInfo.FileVersion\n'''
              if old not in t: raise SystemExit('Invoke resolved-meta block not found')
              t=t.replace(old,new)
              t=re.sub(r'\n  \$needsAngleInclude = \$false\n.*?\n  \$probeDir =', '\n  $probeDir =', t, flags=re.S)
              return t
          edit('.github/actions/mql5-native-compile/Invoke-VKMql5Compile.ps1', fix_invoke)

          def fix_action(t):
              t=t.replace("          -InstallerUrl '' `\n",'').replace("          -InstallerSha256 '' `\n",'').replace("          -WarmStdlib never `\n",'')
              return t
          edit('.github/actions/mql5-native-compile/action.yml', fix_action)

          # Legacy evidence runner delegates local MetaEditor execution to canonical compile.py.
          def fix_runner(t):
              t=t.replace('import subprocess\n','')
              t=t.replace('from .compile_core import CompileFailureCode, CompilePolicy, evaluate_compile_files\n','from .compile_core import CompileFailureCode\nfrom .compile import compile_mq5\n')
              pattern=r'def run_metaeditor\(.*?\n\n\ndef main\('
              replacement='''def run_metaeditor(\n    ea: Path,\n    metaeditor: Path,\n    out_dir: Path,\n    extra_args: list[str] | None = None,\n    timeout_sec: int = 180,\n    *,\n    max_warnings: int = 0,\n) -> dict[str, Any]:\n    """Compatibility evidence wrapper over canonical ``compile.compile_mq5``.\n\n    ``mql5-compile`` owns local/Wine process execution and compile truth. This\n    wrapper preserves the historical evidence-manifest surface without a second\n    MetaEditor subprocess/parser implementation.\n    """\n    if extra_args:\n        return {\n            "cmd": [], "returncode": None, "log_path": str(out_dir / "compile.log"),\n            "ok": False, "reason": "extra MetaEditor args are unsupported by the compatibility wrapper",\n            "failure_codes": [CompileFailureCode.INVOCATION_FAILED.value], "stdout": "", "stderr": "",\n        }\n    log_path = out_dir / "compile.log"\n    result = compile_mq5(\n        ea, metaeditor=str(metaeditor), log_path=log_path, timeout=timeout_sec,\n        max_warnings=max_warnings,\n    )\n    return {\n        "cmd": [str(metaeditor), "/compile:" + str(ea), "/log:" + str(log_path)],\n        "returncode": None,\n        "log_path": str(log_path),\n        "ok": result.success,\n        "error_count": result.error_count,\n        "warning_count": result.warning_count,\n        "result_summary": result.result_summary,\n        "failure_codes": result.failure_codes,\n        "errors": result.errors,\n        "warnings": result.warnings,\n        "ex5_path": result.ex5_path,\n        "stdout": "",\n        "stderr": "",\n    }\n\n\ndef main('''
              new,n=re.subn(pattern,replacement,t,flags=re.S)
              if n!=1: raise SystemExit(f'compile_runner run_metaeditor replacement count={n}')
              new=new.replace('This command never fabricates compile success. All local MetaEditor parsing uses\n``compile_core``; remote backends remain fail-closed and artifact-verified.', 'This compatibility command never fabricates compile success. Local/Wine execution delegates to the canonical ``mql5-compile`` engine; remote-worker evidence remains fail-closed and artifact-verified.')
              return new
          edit('tool/source/scripts/vibecodekit_mql5/compile_runner.py', fix_runner)

          # Phase36 becomes a regression lock against reintroducing the dormant duplicate toolchain path.
          def fix_phase36(t):
              t=t.replace('    assert "-InstallerUrl \'\'" in action\n    assert "-WarmStdlib never" in action\n', '    assert "-InstallerUrl \'\'" not in action\n    assert "-InstallerSha256 \'\'" not in action\n    assert "-WarmStdlib never" not in action\n')
              marker='''    assert "steps.prepare-toolchain.outputs.metaeditor" in action\n'''
              t=t.replace(marker, marker + '''    invoke = (repo / ".github/actions/mql5-native-compile/Invoke-VKMql5Compile.ps1").read_text(encoding="utf-8")\n    assert "function Resolve-MetaEditor(" not in invoke\n    assert "InstallerUrl" not in invoke\n    assert "WarmStdlib" not in invoke\n    assert "Start-Sleep -Seconds 20" not in invoke\n''')
              return t
          edit('tool/source/tests/test_phase36_native_smoke_hardening.py', fix_phase36)

          # Hygiene: require the split action and reject transient smoke/demo artifacts.
          def fix_hygiene(t):
              anchor='''    ".github/actions/mql5-native-compile/Invoke-VKMql5Compile.ps1",\n'''
              t=t.replace(anchor, anchor + '''    ".github/actions/mql5-native-compile/Prepare-VKMql5Toolchain.ps1",\n    ".github/actions/mql5-native-compile/Finalize-VKMql5ToolchainEvidence.ps1",\n    "scripts/maintenance/check_duplicate_content.py",\n''')
              anchor2='''    tracked_set = set(tracked)\n'''
              block='''    transient = [rel for rel in tracked if (\n        (rel.startswith(".github/workflows/") and re.search(r"(?:^|[-_])(demo|remediation)(?:[-_.]|$)", PurePosixPath(rel).name))\n        or rel.startswith("demo/rc7/")\n        or rel.startswith("demo/final/")\n    )]\n    for rel in transient:\n        errors.append(f"transient smoke/remediation artifact is tracked: {rel}")\n'''
              t=t.replace(anchor2, anchor2 + block)
              guidecheck='''    guide = (ROOT / "tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md").read_text(encoding="utf-8")\n    if f"kit_version: {current_version}" not in guide or f"Phiên bản tài liệu: **v{current_version}**" not in guide:\n        errors.append("canonical Vietnamese guide version does not match active candidate")\n\n    invoke = (ROOT / ".github/actions/mql5-native-compile/Invoke-VKMql5Compile.ps1").read_text(encoding="utf-8")\n    for forbidden in ("function Resolve-MetaEditor(", "InstallerUrl", "WarmStdlib", "Start-Sleep -Seconds 20"):\n        if forbidden in invoke:\n            errors.append(f"native compile runner still owns toolchain preparation: {forbidden}")\n\n'''
              t=t.replace('''    # RC6 release documents/workflows are immutable historical compatibility\n''', guidecheck + '''    # RC6 release documents/workflows are immutable historical compatibility\n''')
              return t
          edit('scripts/maintenance/check_rc6_hygiene.py', fix_hygiene)

          # Release gate now enforces duplicate policy as a first-class hygiene invariant.
          edit('.github/workflows/release-gate.yml', lambda t: t.replace('python scripts/maintenance/check_rc6_hygiene.py', 'python scripts/maintenance/check_rc6_hygiene.py\n          python scripts/maintenance/check_duplicate_content.py'))

          # Future maintenance/test changes automatically refresh derived metadata.
          def fix_refresh(t):
              start="      - 'scripts/maintenance/repo_manifest.py'\n"
              end="      - 'scripts/native/**'\n"
              if start in t and end in t:
                  a=t.index(start); b=t.index(end,a)
                  t=t[:a] + "      - 'scripts/maintenance/**'\n" + t[b:]
              return t
          edit('.github/workflows/repo-manifest-refresh.yml', fix_refresh)

          # Active candidate docs, while root release boundary remains RC6.
          def fix_guide(t):
              t=t.replace('kit_version: 3.3.0rc6','kit_version: 3.3.0rc7')
              t=t.replace('Phiên bản tài liệu: **v3.3.0rc6**','Phiên bản tài liệu: **v3.3.0rc7**')
              return t
          edit('tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md', fix_guide)

          def fix_status(t):
              insert='''\n## Native smoke evidence after PR hardening\n\nThe PR verification path above was correctly `SKIPPED / UNTESTABLE` because the repository secret was absent. Separately, after PR #9 was merged, the fixed composite action was exercised on a real GitHub-hosted Windows 2022 runner using the official MetaQuotes installer. Run `31589533638`, job `94091042352`, source commit `35e462ece353b4cbdf73305a4f9c672c85809cd5` completed the compile and evidence-validation steps successfully with `Result: 0 errors, 0 warnings` and a physical EX5.\n\nThat smoke proves the RC7 native compile implementation, but it is not evidence for the final remediation commit and it does not promote Strategy Tester, restart/recovery, broker parity, forward-test or live gates. A fresh exact-candidate native compile is required after remediation.\n'''
              return t.replace('\n## Release eligibility\n', insert + '\n## Release eligibility\n')
          edit('docs/release/v3.3.0rc7/RC7-CANDIDATE-STATUS.md', fix_status)

          def fix_root_readme(t):
              needle='''> Artifact RC4 và RC5 được giữ lại như lịch sử bất biến. RC6 đã hoàn tất parity\n> giữa source, source ZIP và wheel, nhưng điều kiện production vẫn bị chặn do\n> chưa có bằng chứng MetaEditor, MT5 Strategy Tester và restart/recovery đáng\n> tin cậy.\n'''
              add='''\n> **Phân tách release/candidate:** RC6 là tester pre-release gần nhất đã publish;\n> `tool/source/` hiện là active **v3.3.0rc7 candidate** với backend GitHub Actions\n> native MetaEditor. Không được diễn giải candidate RC7 thành một RC7 release.\n'''
              if needle not in t: raise SystemExit('root README release boundary anchor missing')
              return t.replace(needle, needle+add)
          edit('README.md', fix_root_readme)
          PY

          # Self-remove the temporary remediation executor before hygiene/manifest evaluation.
          git rm -f .github/workflows/rc7-remediation-apply.yml

          python scripts/maintenance/check_rc6_hygiene.py
          python scripts/maintenance/check_duplicate_content.py

      - name: Full source regression and selftest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install './tool/source[dev]'
          cd tool/source
          python -m pytest -q
          python -m vibecodekit_mql5.selftest
          cd ../..

      - name: Regenerate canonical derived metadata
        shell: bash
        run: |
          cd tool/source
          PYTHONPATH=scripts python -m vibecodekit_mql5.manifest --emit --output tool-catalog.json
          PYTHONPATH=scripts python -m vibecodekit_mql5.agent_contract --emit --output agent-contract.json
          cd ../..
          python scripts/maintenance/sync_distribution_snapshot.py sync
          git add -A
          python scripts/maintenance/repo_manifest.py --write
          git add -A
          python scripts/maintenance/repo_manifest.py --check
          python scripts/maintenance/check_rc6_hygiene.py
          python scripts/maintenance/check_duplicate_content.py

      - name: Commit remediation candidate
        shell: bash
        run: |
          git config user.name 'hoaithivo0511-eng'
          git config user.email 'hoaithivo0511@gmail.com'
          git add -A
          git commit -m 'fix(rc7): consolidate compile paths and restore repository integrity'
          git push
