name: Frozen RC4 Package Regression

on:
  push:
    branches:
      - main
      - 'release-prep/**'
      - 'hardening/**'
    paths:
      - 'VibecodeKit-MQL5-v3.3.0rc4-runtime-safety-fix-bundle.zip'
      - 'tool/vibecodekit-mql5-v3.3.0rc4-source-full.zip'
      - 'tool/vibecodekit_mql5_ea-3.3.0rc4-py3-none-any.whl'
      - '.github/workflows/package-regression.yml'
      - 'scripts/maintenance/assert_junit_clean.py'
  pull_request:
    paths:
      - 'VibecodeKit-MQL5-v3.3.0rc4-runtime-safety-fix-bundle.zip'
      - 'tool/vibecodekit-mql5-v3.3.0rc4-source-full.zip'
      - 'tool/vibecodekit_mql5_ea-3.3.0rc4-py3-none-any.whl'
      - '.github/workflows/package-regression.yml'
      - 'scripts/maintenance/assert_junit_clean.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-archive-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Extract canonical source archive
        run: |
          rm -rf /tmp/vkmql-source-zip
          mkdir -p /tmp/vkmql-source-zip
          unzip -q tool/vibecodekit-mql5-v3.3.0rc4-source-full.zip -d /tmp/vkmql-source-zip
      - name: Install extracted source + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '/tmp/vkmql-source-zip[dev]' 'reportlab>=4'
      - name: Run extracted source regression
        run: |
          cd /tmp/vkmql-source-zip
          python -m pytest -q --junitxml="${RUNNER_TEMP}/rc4-source-tests.xml"
          cd "${GITHUB_WORKSPACE}"
          python scripts/maintenance/assert_junit_clean.py "${RUNNER_TEMP}/rc4-source-tests.xml"
      - name: Run extracted source selftest
        run: |
          cd /tmp/vkmql-source-zip
          python -m vibecodekit_mql5.selftest

  wheel-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install wheel + test-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=7.4' 'pytest-cov>=4.1' 'ruff>=0.1' 'reportlab>=4'
          python -m pip install tool/vibecodekit_mql5_ea-3.3.0rc4-py3-none-any.whl
      - name: Copy regression tests outside source checkout
        run: |
          rm -rf /tmp/vkmql-wheel-suite
          mkdir -p /tmp/vkmql-wheel-suite
          unzip -q tool/vibecodekit-mql5-v3.3.0rc4-source-full.zip 'tests/*' -d /tmp/vkmql-wheel-suite
      - name: Verify package import origin
        run: |
          cd /tmp
          python - <<'PY'
          from pathlib import Path
          import vibecodekit_mql5

          package_file = Path(vibecodekit_mql5.__file__).resolve()
          print(f'wheel import origin: {package_file}')
          if 'site-packages' not in package_file.parts:
              raise SystemExit(f'wheel isolation failed: runtime package is not from site-packages: {package_file}')
          PY
      - name: Run installed wheel regression
        env:
          PYTHONPATH: /tmp/vkmql-wheel-suite/tests
        run: |
          cd /tmp/vkmql-wheel-suite
          python -m pytest -q tests --junitxml="${RUNNER_TEMP}/rc4-wheel-tests.xml"
          cd "${GITHUB_WORKSPACE}"
          python scripts/maintenance/assert_junit_clean.py "${RUNNER_TEMP}/rc4-wheel-tests.xml"
      - name: Run installed wheel selftest
        env:
          PYTHONPATH: ''
        run: |
          cd /tmp
          mql5-selftest
