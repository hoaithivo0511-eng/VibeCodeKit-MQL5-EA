name: RC6 Package Integration Gate

on:
  push:
    branches:
      - 'integration/**'
      - 'hardening/v3.3.0rc6'
    paths:
      - '.github/workflows/rc6-package-integration.yml'
      - 'scripts/maintenance/build_rc6_candidate.py'
      - 'scripts/maintenance/sync_distribution_snapshot.py'
      - 'tool/source/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/source/pyproject.toml
      - name: Install candidate build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install './tool/source[dev]'
      - name: Verify canonical snapshot and reproducible wheel
        run: |
          python scripts/maintenance/sync_distribution_snapshot.py verify
          python scripts/maintenance/build_rc6_candidate.py repro-check
      - name: Build fail-closed RC6 candidate
        run: |
          python scripts/maintenance/build_rc6_candidate.py build \
            --build-input-sha "$GITHUB_SHA"
          python scripts/maintenance/build_rc6_candidate.py verify
      - name: Test live source
        run: |
          cd tool/source
          python -m pytest -q --junitxml="${RUNNER_TEMP}/rc6-live.xml"
          python -m vibecodekit_mql5.selftest 2>&1 \
            | tee "${RUNNER_TEMP}/rc6-live-selftest.txt"
      - name: Test source archive
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/rc6-source"
          mkdir -p "$work"
          unzip -q tool/vibecodekit-mql5-v3.3.0rc6-source-full.zip -d "$work"
          python -m pip install "$work[dev]"
          cd "$work"
          python -m pytest -q --junitxml="${RUNNER_TEMP}/rc6-source.xml"
          python -m vibecodekit_mql5.selftest 2>&1 \
            | tee "${RUNNER_TEMP}/rc6-source-selftest.txt"
      - name: Test installed wheel outside source checkout
        run: |
          set -euo pipefail
          suite="${RUNNER_TEMP}/rc6-wheel-suite"
          venv="${RUNNER_TEMP}/rc6-wheel-venv"
          mkdir -p "$suite"
          unzip -q tool/vibecodekit-mql5-v3.3.0rc6-source-full.zip 'tests/*' -d "$suite"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install \
            'pytest>=7.4' 'pytest-cov>=4.1' 'ruff>=0.1' 'reportlab>=4' \
            tool/vibecodekit_mql5_ea-3.3.0rc6-py3-none-any.whl
          cd "$suite"
          PYTHONPATH="$suite/tests" "$venv/bin/python" -m pytest -q tests \
            --junitxml="${RUNNER_TEMP}/rc6-wheel.xml"
          cd "${RUNNER_TEMP}"
          PYTHONPATH='' "$venv/bin/mql5-selftest" 2>&1 \
            | tee "${RUNNER_TEMP}/rc6-wheel-selftest.txt"
      - name: Assert clean parity and candidate hashes
        run: |
          python scripts/maintenance/assert_junit_clean.py "${RUNNER_TEMP}/rc6-live.xml"
          python scripts/maintenance/assert_junit_clean.py "${RUNNER_TEMP}/rc6-source.xml"
          python scripts/maintenance/assert_junit_clean.py "${RUNNER_TEMP}/rc6-wheel.xml"
          python scripts/maintenance/build_rc6_candidate.py verify
      - name: Upload verified fail-closed candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vibecodekit-mql5-rc6-candidate-${{ github.sha }}
          if-no-files-found: error
          path: |
            tool/vibecodekit-mql5-v3.3.0rc6-source-full.zip
            tool/vibecodekit-mql5-v3.3.0rc6-source-full.manifest.json
            tool/vibecodekit_mql5_ea-3.3.0rc6-py3-none-any.whl
            VibecodeKit-MQL5-v3.3.0rc6-runtime-candidate-bundle.zip
            docs/release/v3.3.0rc6/RC6-CANDIDATE-MANIFEST.json
            docs/release/v3.3.0rc6/RC6-ARTIFACTS.sha256
