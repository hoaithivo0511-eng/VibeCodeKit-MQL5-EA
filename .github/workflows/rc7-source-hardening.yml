name: RC7 Source Hardening

on:
  push:
    branches: ['hardening/rc7-audit-remediation']
    paths: ['.github/workflows/rc7-remediation-source-v2.yml']

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: hardening/rc7-audit-remediation
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create duplicate-content policy
        shell: bash
        run: |
          cat > scripts/maintenance/check_duplicate_content.py <<'PYFILE'
          #!/usr/bin/env python3
          """Fail closed on unclassified byte-identical tracked files."""
          from __future__ import annotations

          import hashlib
          import subprocess
          from collections import defaultdict
          from pathlib import Path, PurePosixPath

          ROOT = Path(__file__).resolve().parents[2]


          def tracked_files() -> list[Path]:
              raw = subprocess.check_output(["git", "ls-files", "-z"], cwd=ROOT)
              return [ROOT / item.decode() for item in raw.split(b"\0") if item]


          def allowed(paths: list[str]) -> tuple[bool, str]:
              group = set(paths)
              if (
                  any("tool/source/scripts/vibecodekit_mql5/resources/" in p for p in paths)
                  and all(p.startswith("tool/source/") for p in paths)
              ):
                  return True, "packaged-resource-mirror"
              if all(
                  p.startswith("demo/CCBSN_GoldenFixture/")
                  or p.startswith("demo/generic-acceptance/")
                  for p in paths
              ):
                  return True, "self-contained-acceptance-fixtures"
              frozen = {
                  "demo/CCBSN-build-plan.json",
                  "demo/CCBSN-configured-ir.json",
                  "demo/CCBSN_GoldenFixture/BUILD-PLAN.json",
                  "demo/CCBSN_GoldenFixture/EA-IR.json",
              }
              if group <= frozen and len(group) > 1:
                  return True, "frozen-bundle-input"
              if all(p.startswith("reports/") for p in paths):
                  return True, "historical-report-evidence"
              if len(paths) == 2:
                  left, right = sorted(paths)
                  native_prefix = "native/workers-windows/"
                  package_prefix = "tool/source/workers/windows/"
                  if (
                      left.startswith(native_prefix)
                      and right.startswith(package_prefix)
                      and left[len(native_prefix):] == right[len(package_prefix):]
                  ):
                      return True, "native-worker-handoff"
              if all(PurePosixPath(p).name == "LICENSE" for p in paths):
                  return True, "license-copy"
              return False, ""


          def evaluate() -> list[tuple[str, list[str]]]:
              groups: dict[str, list[str]] = defaultdict(list)
              for path in tracked_files():
                  if not path.is_file() or path.is_symlink() or path.stat().st_size == 0:
                      continue
                  rel = path.relative_to(ROOT).as_posix()
                  groups[hashlib.sha256(path.read_bytes()).hexdigest()].append(rel)
              bad: list[tuple[str, list[str]]] = []
              for digest, paths in sorted(groups.items()):
                  if len(paths) < 2:
                      continue
                  ok, _ = allowed(paths)
                  if not ok:
                      bad.append((digest, paths))
              return bad


          def main() -> int:
              bad = evaluate()
              if bad:
                  print("duplicate content policy: FAIL")
                  for digest, paths in bad:
                      print(digest)
                      for path in paths:
                          print(f"  {path}")
                  return 1
              print("duplicate content policy: PASS")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PYFILE
          chmod +x scripts/maintenance/check_duplicate_content.py
      - name: Apply audited source transformations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path: str, fn) -> None:
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              new = fn(old)
              if new == old:
                  raise SystemExit(f'expected edit produced no change: {path}')
              p.write_text(new, encoding='utf-8')

          def fix_invoke(t: str) -> str:
              for line in (
                  '  [string]$InstallerUrl = "",\n',
                  '  [string]$InstallerSha256 = "",\n',
                  '  [ValidateSet("auto","always","never")][string]$WarmStdlib = "auto",\n',
              ):
                  if line not in t:
                      raise SystemExit(f'Invoke parameter anchor missing: {line.strip()}')
                  t = t.replace(line, '')
              t, n = re.subn(
                  r'function Assert-SafeHttpsUrl\(\[string\]\$Url\) \{.*?\nfunction Copy-NormalizedTree',
                  'function Copy-NormalizedTree', t, flags=re.S,
              )
              if n != 1:
                  raise SystemExit(f'Invoke toolchain function removal count={n}')
              old = '''  $resolvedMeta = Resolve-MetaEditor $MetaEditor $InstallerUrl $InstallerSha256\n  $metaPath = [string]$resolvedMeta.path\n  $metaInfo.path = $metaPath\n  $metaInfo.installer_sha256 = [string]$resolvedMeta.installer_sha256\n  $metaInfo.version = [string](Get-Item -LiteralPath $metaPath).VersionInfo.FileVersion\n'''
              new = '''  if (-not $MetaEditor) { throw "TOOLCHAIN_INSTALL_FAILED: prepared MetaEditor path is required" }\n  $resolvedMeta = Resolve-Path -LiteralPath $MetaEditor -ErrorAction SilentlyContinue\n  if (-not $resolvedMeta) { throw "TOOLCHAIN_INSTALL_FAILED: prepared MetaEditor path not found: $MetaEditor" }\n  $metaPath = [string]$resolvedMeta.Path\n  $metaInfo.path = $metaPath\n  $metaInfo.installer_sha256 = ""\n  $metaInfo.version = [string](Get-Item -LiteralPath $metaPath).VersionInfo.FileVersion\n'''
              if old not in t:
                  raise SystemExit('Invoke resolved-MetaEditor anchor missing')
              t = t.replace(old, new)
              t, n = re.subn(r'\n  \$needsAngleInclude = \$false\n.*?\n  \$probeDir =', '\n  $probeDir =', t, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Invoke dormant stdlib warm removal count={n}')
              for forbidden in ('function Resolve-MetaEditor(', 'InstallerUrl', 'WarmStdlib', 'Start-Sleep -Seconds 20'):
                  if forbidden in t:
                      raise SystemExit(f'Invoke still contains forbidden preparation path: {forbidden}')
              return t

          edit('.github/actions/mql5-native-compile/Invoke-VKMql5Compile.ps1', fix_invoke)

          def fix_action(t: str) -> str:
              for line in ("          -InstallerUrl '' `\n", "          -InstallerSha256 '' `\n", "          -WarmStdlib never `\n"):
                  if line not in t:
                      raise SystemExit(f'action Invoke compatibility arg missing: {line.strip()}')
                  t = t.replace(line, '')
              return t

          edit('.github/actions/mql5-native-compile/action.yml', fix_action)

          def fix_runner(t: str) -> str:
              if 'import subprocess\n' not in t:
                  raise SystemExit('compile_runner subprocess import anchor missing')
              t = t.replace('import subprocess\n', '')
              old_import = 'from .compile_core import CompileFailureCode, CompilePolicy, evaluate_compile_files\n'
              if old_import not in t:
                  raise SystemExit('compile_runner compile_core import anchor missing')
              t = t.replace(old_import, 'from .compile_core import CompileFailureCode\nfrom .compile import compile_mq5\n')
              pattern = r'def run_metaeditor\(.*?\n\n\ndef main\('
              replacement = '''def run_metaeditor(\n    ea: Path,\n    metaeditor: Path,\n    out_dir: Path,\n    extra_args: list[str] | None = None,\n    timeout_sec: int = 180,\n    *,\n    max_warnings: int = 0,\n) -> dict[str, Any]:\n    """Compatibility evidence wrapper over canonical ``compile.compile_mq5``.\n\n    ``mql5-compile`` owns local/Wine MetaEditor execution and compile truth.\n    This wrapper preserves the historical evidence-manifest surface without a\n    second subprocess/parser implementation.\n    """\n    if extra_args:\n        return {\n            "cmd": [], "returncode": None, "log_path": str(out_dir / "compile.log"),\n            "ok": False,\n            "reason": "extra MetaEditor args are unsupported by the compatibility wrapper",\n            "failure_codes": [CompileFailureCode.INVOCATION_FAILED.value],\n            "stdout": "", "stderr": "",\n        }\n    log_path = out_dir / "compile.log"\n    result = compile_mq5(\n        ea, metaeditor=str(metaeditor), log_path=log_path, timeout=timeout_sec,\n        max_warnings=max_warnings,\n    )\n    return {\n        "cmd": [str(metaeditor), "/compile:" + str(ea), "/log:" + str(log_path)],\n        "returncode": None, "log_path": str(log_path), "ok": result.success,\n        "error_count": result.error_count, "warning_count": result.warning_count,\n        "result_summary": result.result_summary, "failure_codes": result.failure_codes,\n        "errors": result.errors, "warnings": result.warnings, "ex5_path": result.ex5_path,\n        "stdout": "", "stderr": "",\n    }\n\n\ndef main('''
              t, n = re.subn(pattern, replacement, t, flags=re.S)
              if n != 1:
                  raise SystemExit(f'compile_runner run_metaeditor replacement count={n}')
              t = t.replace(
                  'This command never fabricates compile success. All local MetaEditor parsing uses\n``compile_core``; remote backends remain fail-closed and artifact-verified.',
                  'This compatibility command never fabricates compile success. Local/Wine execution delegates to the canonical ``mql5-compile`` engine; remote-worker evidence remains fail-closed and artifact-verified.',
              )
              return t

          edit('tool/source/scripts/vibecodekit_mql5/compile_runner.py', fix_runner)

          def fix_phase36(t: str) -> str:
              old = '''    assert "-InstallerUrl ''" in action\n    assert "-WarmStdlib never" in action\n    assert "steps.prepare-toolchain.outputs.metaeditor" in action\n'''
              new = '''    assert "-InstallerUrl ''" not in action\n    assert "-InstallerSha256 ''" not in action\n    assert "-WarmStdlib never" not in action\n    assert "steps.prepare-toolchain.outputs.metaeditor" in action\n    invoke = (repo / ".github/actions/mql5-native-compile/Invoke-VKMql5Compile.ps1").read_text(encoding="utf-8")\n    assert "function Resolve-MetaEditor(" not in invoke\n    assert "InstallerUrl" not in invoke\n    assert "WarmStdlib" not in invoke\n    assert "Start-Sleep -Seconds 20" not in invoke\n'''
              if old not in t:
                  raise SystemExit('phase36 action assertion anchor missing')
              return t.replace(old, new)

          edit('tool/source/tests/test_phase36_native_smoke_hardening.py', fix_phase36)

          def fix_hygiene(t: str) -> str:
              anchor = '    ".github/actions/mql5-native-compile/Invoke-VKMql5Compile.ps1",\n'
              addition = anchor + '    ".github/actions/mql5-native-compile/Prepare-VKMql5Toolchain.ps1",\n' + '    ".github/actions/mql5-native-compile/Finalize-VKMql5ToolchainEvidence.ps1",\n' + '    "scripts/maintenance/check_duplicate_content.py",\n'
              if anchor not in t:
                  raise SystemExit('hygiene required path anchor missing')
              t = t.replace(anchor, addition, 1)
              tracked_anchor = '    tracked_set = set(tracked)\n'
              transient = '''    transient = [\n        rel\n        for rel in tracked\n        if (\n            (\n                rel.startswith(".github/workflows/")\n                and re.search(r"(?:^|[-_])(demo|remediation)(?:[-_.]|$)", PurePosixPath(rel).name)\n            )\n            or rel.startswith("demo/rc7/")\n            or rel.startswith("demo/final/")\n        )\n    ]\n    for rel in transient:\n        errors.append(f"transient smoke/remediation artifact is tracked: {rel}")\n'''
              if tracked_anchor not in t:
                  raise SystemExit('hygiene tracked-set anchor missing')
              t = t.replace(tracked_anchor, tracked_anchor + transient, 1)
              docs_anchor = '    # RC6 release documents/workflows are immutable historical compatibility\n'
              docs_check = '''    guide = (ROOT / "tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md").read_text(encoding="utf-8")\n    if f"kit_version: {current_version}" not in guide or f"Phiên bản tài liệu: **v{current_version}**" not in guide:\n        errors.append("canonical Vietnamese guide version does not match active candidate")\n\n    invoke = (ROOT / ".github/actions/mql5-native-compile/Invoke-VKMql5Compile.ps1").read_text(encoding="utf-8")\n    for forbidden in ("function Resolve-MetaEditor(", "InstallerUrl", "WarmStdlib", "Start-Sleep -Seconds 20"):\n        if forbidden in invoke:\n            errors.append(f"native compile runner still owns toolchain preparation: {forbidden}")\n\n'''
              if docs_anchor not in t:
                  raise SystemExit('hygiene current-doc anchor missing')
              t = t.replace(docs_anchor, docs_check + docs_anchor, 1)
              root_anchor = '''    if RC6_VERSION not in readme or "release_eligible=false" not in readme:\n        errors.append("root README no longer preserves RC6 fail-closed release status")\n    if RC6_VERSION not in structure or "Task 18" not in structure:\n        errors.append("STRUCTURE.md no longer preserves the RC6 native gate history")\n'''
              root_new = root_anchor + '''    if current_version not in readme or "candidate" not in readme.lower():\n        errors.append("root README does not identify the active RC7 candidate source")\n    if current_version not in structure or "candidate" not in structure.lower():\n        errors.append("STRUCTURE.md does not identify the active RC7 candidate source")\n'''
              if root_anchor not in t:
                  raise SystemExit('hygiene root-doc anchor missing')
              return t.replace(root_anchor, root_new, 1)

          edit('scripts/maintenance/check_rc6_hygiene.py', fix_hygiene)

          def fix_guide(t: str) -> str:
              if 'kit_version: 3.3.0rc6' not in t or 'Phiên bản tài liệu: **v3.3.0rc6**' not in t:
                  raise SystemExit('Vietnamese guide RC6 anchors missing')
              return t.replace('kit_version: 3.3.0rc6', 'kit_version: 3.3.0rc7', 1).replace('Phiên bản tài liệu: **v3.3.0rc6**', 'Phiên bản tài liệu: **v3.3.0rc7**', 1)

          edit('tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md', fix_guide)

          def fix_status(t: str) -> str:
              if '31589533638' in t:
                  return t
              marker = '\n## Release eligibility\n'
              if marker not in t:
                  raise SystemExit('RC7 candidate status release marker missing')
              insert = '''\n## Native smoke evidence after PR hardening\n\nAfter PR #9 was merged, the fixed composite action was exercised on a real GitHub-hosted Windows 2022 runner with the official MetaQuotes installer. Run `31589533638`, job `94091042352`, bound to source commit `35e462ece353b4cbdf73305a4f9c672c85809cd5`, completed successfully with `Result: 0 errors, 0 warnings` and a physical EX5.\n\nThat smoke proves the RC7 native compile implementation at that bound source. It is not evidence for this remediation commit and does not promote Strategy Tester, restart/recovery, broker parity, forward-test or live gates. A fresh exact-candidate native compile remains required after remediation.\n'''
              return t.replace(marker, insert + marker, 1)

          edit('docs/release/v3.3.0rc7/RC7-CANDIDATE-STATUS.md', fix_status)

          def fix_readme(t: str) -> str:
              status = '> Trạng thái phát hành: **candidate-integrated / `release_eligible=false`**.\n'
              note = '> Source đang phát triển trong `tool/source/` là **v3.3.0rc7 candidate**; candidate này có backend native MetaEditor qua GitHub Actions nhưng chưa phải RC7 release/promotion.\n'
              if status not in t:
                  raise SystemExit('root README release-status anchor missing')
              if note not in t:
                  t = t.replace(status, status + note, 1)
              oldrow = '| `tool/source/` | Mã nguồn hardening v3.3.0rc6 đang hoạt động; chỉ sinh candidate artifact sau khi các gate triển khai đã đạt. |'
              newrow = '| `tool/source/` | Mã nguồn **v3.3.0rc7 candidate** đang hoạt động; GitHub Actions native MetaEditor đã có backend/evidence path, nhưng release promotion vẫn fail-closed theo các native/runtime gate độc lập. |'
              if oldrow not in t:
                  raise SystemExit('root README tool/source row anchor missing')
              return t.replace(oldrow, newrow, 1)

          edit('README.md', fix_readme)

          def fix_structure(t: str) -> str:
              old_title = '# Repository structure — v3.3.0rc6 hardening line'
              if old_title not in t:
                  raise SystemExit('STRUCTURE title anchor missing')
              t = t.replace(old_title, '# Repository structure — RC6 release boundary + v3.3.0rc7 active candidate', 1)
              t = t.replace('│   └── release/                 immutable RC4/RC5 history + active RC6 plan', '│   └── release/                 immutable history + RC6 boundary + active RC7 candidate records', 1)
              t = t.replace('│   ├── source/                 active RC6 hardening source', '│   ├── source/                 active v3.3.0rc7 candidate source', 1)
              anchor = 'This map describes the **role** of each repository area rather than embedding file/byte counts that become stale after maintenance commits.\n'
              note = '\nThe published/frozen release boundary remains RC6, while `tool/source/` is the active **v3.3.0rc7 candidate**. Candidate status must not be interpreted as an RC7 release or as Strategy Tester/live eligibility.\n'
              if anchor not in t:
                  raise SystemExit('STRUCTURE introduction anchor missing')
              return t.replace(anchor, anchor + note, 1)

          edit('STRUCTURE.md', fix_structure)
          PY
          rm -f demo/rc7/Experts/RC7CompileDemo.mq5 demo/final/Experts/RC7FinalCompileDemo.mq5
      - name: Verify and commit source remediation
        shell: bash
        run: |
          set -euo pipefail
          git add .github/actions/mql5-native-compile/action.yml .github/actions/mql5-native-compile/Invoke-VKMql5Compile.ps1 scripts/maintenance/check_duplicate_content.py scripts/maintenance/check_rc6_hygiene.py tool/source/scripts/vibecodekit_mql5/compile_runner.py tool/source/tests/test_phase36_native_smoke_hardening.py tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md docs/release/v3.3.0rc7/RC7-CANDIDATE-STATUS.md README.md STRUCTURE.md demo/rc7/Experts/RC7CompileDemo.mq5 demo/final/Experts/RC7FinalCompileDemo.mq5
          python scripts/maintenance/check_duplicate_content.py
          python -m pip install './tool/source[dev]'
          cd tool/source
          python -m pytest -q
          cd ../..
          python -m vibecodekit_mql5.selftest
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rc7): consolidate compile authority and repository hygiene'
          git pull --rebase origin hardening/rc7-audit-remediation
          git push origin HEAD:hardening/rc7-audit-remediation
