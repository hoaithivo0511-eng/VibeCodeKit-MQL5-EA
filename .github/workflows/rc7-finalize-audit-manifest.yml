name: RC7 Finalize Audit Manifest

on:
  push:
    branches:
      - 'audit/rc7-full-e2e-docs-sync'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/rc7-full-e2e-docs-sync
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Re-run focused release-truth regression
        run: |
          python -m pip install './tool/source[dev]'
          cd tool/source
          python -m pytest -q \
            tests/test_phase33_github_compile_backend.py \
            tests/test_phase36_native_smoke_hardening.py \
            tests/test_phase37_canonical_native_probe.py \
            tests/test_phase38_rc7_full_e2e_truth.py

      - name: Finalize snapshot and manifest without bootstrap residue
        run: |
          python scripts/maintenance/sync_distribution_snapshot.py sync
          git rm .github/workflows/rc7-finalize-audit-manifest.yml
          git add tool/source/scripts/vibecodekit_mql5/resources/distribution
          python scripts/maintenance/repo_manifest.py --write
          git add REPO-MANIFEST.sha256
          python scripts/maintenance/repo_manifest.py --check

      - name: Commit clean final audit tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(audit): finalize RC7 audit manifest"
          git push
