name: RC5 Native Evidence Gate

on:
  pull_request:
    branches:
      - 'hardening/v3.3.0rc5'
    paths:
      - '.github/workflows/rc5-native-evidence-gate.yml'
      - 'scripts/release/**'
      - 'tool/native/**'
      - 'tool/source/**'
      - 'release-evidence/v3.3.0rc5/**'
      - 'docs/release/v3.3.0rc5/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: native-evidence-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install immutable RC5 source + dev dependencies
        run: python -m pip install -e './tool/source[dev]'
      - name: Prove Task-09 source snapshot is still immutable
        run: python scripts/release/verify_rc5_candidate_source.py --repo-root .
      - name: Compile release-only native-evidence tooling
        run: >-
          python -m compileall -q
          scripts/release/rc5_native_gate.py
          scripts/release/native_evidence_collector.py
          scripts/release/verify_rc5_candidate_source.py
      - name: Native evidence contract tests
        run: pytest -q scripts/release/tests/test_rc5_native_gate.py

  native-evidence:
    name: trusted-native-evidence
    needs: contract-tests
    runs-on: ubuntu-latest
    env:
      VCK_RUNNER_PUBLIC_KEY_B64: ${{ secrets.VCK_RUNNER_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install immutable RC5 verifier dependency
        run: python -m pip install -e './tool/source'
      - name: Prove Task-09 source snapshot is still immutable
        run: python scripts/release/verify_rc5_candidate_source.py --repo-root .
      - name: Require real committed native evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence='release-evidence/v3.3.0rc5/evidence/manifest.json'
          if [[ ! -f "$evidence" ]]; then
            echo '::error::Task 10 BLOCKED_NATIVE_EXECUTION: release-evidence/v3.3.0rc5/evidence/manifest.json is absent. A GitHub-hosted Linux runner must not fabricate MetaEditor/MT5 evidence.'
            exit 2
          fi
          if [[ -z "${VCK_RUNNER_PUBLIC_KEY_B64:-}" ]]; then
            echo '::error::Task 10 BLOCKED_TRUST_ROOT: VCK_RUNNER_PUBLIC_KEY_B64 is not configured. Only the public key belongs in GitHub; keep the private key on the native runner.'
            exit 2
          fi
      - name: Validate candidate-bound signed native evidence
        run: >-
          python scripts/release/rc5_native_gate.py
          --repo-root .
          --project-dir release-evidence/v3.3.0rc5
          --json-out docs/release/v3.3.0rc5/PR-10-NATIVE-GATE.json
