name: RC7 Full Audit Apply

on:
  push:
    branches:
      - 'audit/rc7-full-e2e-docs-sync'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/rc7-full-e2e-docs-sync
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Fix GitHub native release-provenance parity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tool/source/scripts/vibecodekit_mql5/provenance.py')
          text = path.read_text(encoding='utf-8')

          old = '''    compile_block = _prov_block(manifest, "compile")
              backtest_block = _prov_block(manifest, "backtest")
              _has_real_provenance(compile_block, "compile", result.errors)
              _has_real_provenance(backtest_block, "backtest", result.errors)
              if not assess_compile_source(compile_block.get("source")).trusted_for_release:
                  result.errors.append("compile source is not trusted for release")
          '''
          # The literal above is intentionally normalized below to avoid YAML
          # indentation affecting the Python source replacement.
          old = old.replace('          ', '')
          new = '''    compile_section_raw = manifest.get("compile")
              compile_section = compile_section_raw if isinstance(compile_section_raw, dict) else {}
              compile_block = _prov_block(manifest, "compile")
              backtest_block = _prov_block(manifest, "backtest")
              _has_real_provenance(compile_block, "compile", result.errors)
              _has_real_provenance(backtest_block, "backtest", result.errors)

              compile_source = str(compile_block.get("source") or "").strip().lower()
              github_compile_verified = False
              if compile_source == "github_actions_metaeditor":
                  from .github_compile_evidence import validate_github_compile_record

                  github_validation = validate_github_compile_record(compile_section)
                  github_compile_verified = github_validation.ok
                  if not github_validation.ok:
                      result.errors.extend(
                          f"GitHub native compile evidence invalid: {error}"
                          for error in github_validation.errors
                      )
              compile_assessment = assess_compile_source(
                  compile_source,
                  provenance_verified=github_compile_verified,
              )
              if not compile_assessment.trusted_for_release:
                  result.errors.append("compile source is not trusted for release")
          '''
          new = new.replace('          ', '')

          if old not in text:
              raise SystemExit('provenance parity patch anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install source and run focused regression
        run: |
          python -m pip install --upgrade pip
          python -m pip install './tool/source[dev]'
          cd tool/source
          python -m pytest -q \
            tests/test_phase33_github_compile_backend.py \
            tests/test_phase36_native_smoke_hardening.py \
            tests/test_phase37_canonical_native_probe.py \
            tests/test_phase38_rc7_full_e2e_truth.py

      - name: Synchronize installed-wheel snapshot
        run: |
          python scripts/maintenance/sync_distribution_snapshot.py sync
          git add tool/source/scripts/vibecodekit_mql5/resources/distribution

      - name: Regenerate repository manifest
        run: python scripts/maintenance/repo_manifest.py --write

      - name: Remove one-shot workflow and commit final audit patch
        run: |
          rm .github/workflows/rc7-full-audit-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rc7): align release provenance and current docs"
          git push
