name: Refresh Repository Manifest

on:
  push:
    branches:
      - 'release-prep/**'
      - 'hardening/**'
      - 'conformance/**'
      - 'release/**'
      - 'feat/rc7-*'
      - 'fix/rc7-*'
    paths:
      - '.github/actions/mql5-native-compile/**'
      - '.github/workflows/**'
      - 'scripts/maintenance/**'
      - 'scripts/native/**'
      - 'tool/source/pyproject.toml'
      - 'tool/source/scripts/vibecodekit_mql5/**'
      - 'tool/source/docs/**'
      - 'tool/source/skill/vibecode-mql5/**'
      - 'tool/source/tests/**'
      - 'docs/release/**'
      - 'RELEASE-TRUST.yaml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'STRUCTURE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Regenerate machine-readable source contracts
        run: |
          cd tool/source
          PYTHONPATH=scripts python -m vibecodekit_mql5.manifest --emit --output tool-catalog.json
          PYTHONPATH=scripts python -m vibecodekit_mql5.agent_contract --emit --output agent-contract.json
      - name: Synchronize installed-wheel verification snapshot
        run: |
          python scripts/maintenance/sync_distribution_snapshot.py sync
          # repo_manifest.py intentionally hashes git-tracked files. Stage the
          # synchronized snapshot before manifest generation so brand-new test
          # snapshot files are part of the same manifest update, not one run late.
          git add tool/source/scripts/vibecodekit_mql5/resources/distribution
      - name: Regenerate repository manifest
        run: python scripts/maintenance/repo_manifest.py --write
      - name: Commit derived release metadata if changed
        run: |
          if git diff --quiet --cached && git diff --quiet -- \
            REPO-MANIFEST.sha256 \
            tool/source/tool-catalog.json \
            tool/source/agent-contract.json; then
            echo "derived release metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            REPO-MANIFEST.sha256 \
            tool/source/tool-catalog.json \
            tool/source/agent-contract.json \
            tool/source/scripts/vibecodekit_mql5/resources/distribution
          git commit -m "chore(release): refresh RC7 derived release metadata"
          git push
