name: Refresh Repository Manifest

on:
  push:
    branches:
      - 'release-prep/**'
      - 'hardening/**'
      - 'conformance/**'
      - 'release/**'
      - 'feat/rc7-*'
    paths:
      - '.github/actions/mql5-native-compile/**'
      - '.github/workflows/repo-manifest-check.yml'
      - '.github/workflows/repo-manifest-refresh.yml'
      - '.github/workflows/release-gate.yml'
      - '.github/workflows/package-regression.yml'
      - '.github/workflows/rc5-conformance-verify.yml'
      - '.github/workflows/rc5-native-evidence-verify.yml'
      - '.github/workflows/rc6-native-evidence-verify.yml'
      - '.github/workflows/rc6-package-integration.yml'
      - '.github/workflows/rc7-github-native-compile.yml'
      - '.github/workflows/rc7-package-integration.yml'
      - 'scripts/maintenance/repo_manifest.py'
      - 'scripts/maintenance/assert_junit_clean.py'
      - 'scripts/maintenance/verify_rc5_native_evidence.py'
      - 'scripts/maintenance/verify_rc6_native_evidence.py'
      - 'scripts/maintenance/check_rc6_hygiene.py'
      - 'scripts/native/**'
      - 'tool/source/pyproject.toml'
      - 'tool/source/scripts/vibecodekit_mql5/**'
      - 'tool/source/docs/**'
      - 'tool/source/skill/vibecode-mql5/**'
      - 'tool/source/tests/test_phase25_native_release_contract.py'
      - 'tool/source/tests/test_phase28_rc6_baseline.py'
      - 'tool/source/tests/test_phase31_compile_core_rc7.py'
      - 'tool/source/tests/test_phase33_github_compile_backend.py'
      - 'tool/source/tests/test_phase34_documentation_runtime.py'
      - 'tool/source/tests/test_phase35_rc7_backend_routing.py'
      - 'docs/release/**'
      - 'RELEASE-TRUST.yaml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'STRUCTURE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Regenerate machine-readable source contracts
        run: |
          cd tool/source
          PYTHONPATH=scripts python -m vibecodekit_mql5.manifest --emit --output tool-catalog.json
          PYTHONPATH=scripts python -m vibecodekit_mql5.agent_contract --emit --output agent-contract.json
      - name: Regenerate repository manifest
        run: python scripts/maintenance/repo_manifest.py --write
      - name: Commit derived manifests if changed
        run: |
          if git diff --quiet -- REPO-MANIFEST.sha256 tool/source/tool-catalog.json tool/source/agent-contract.json; then
            echo "derived manifests already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPO-MANIFEST.sha256 tool/source/tool-catalog.json tool/source/agent-contract.json
          git commit -m "chore(release): refresh RC7 derived manifests"
          git push
