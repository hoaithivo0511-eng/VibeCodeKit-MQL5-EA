name: Refresh Repository Manifest

on:
  push:
    branches:
      - 'release-prep/**'
      - 'hardening/**'
      - 'conformance/**'
      - 'release/**'
    paths:
      - '.github/workflows/repo-manifest-check.yml'
      - '.github/workflows/repo-manifest-refresh.yml'
      - '.github/workflows/release-gate.yml'
      - '.github/workflows/package-regression.yml'
      - '.github/workflows/rc5-conformance-verify.yml'
      - '.github/workflows/rc5-native-evidence-verify.yml'
      - 'scripts/maintenance/repo_manifest.py'
      - 'scripts/maintenance/assert_junit_clean.py'
      - 'scripts/maintenance/verify_rc5_native_evidence.py'
      - 'scripts/native/**'
      - 'tool/source/tests/test_phase25_native_release_contract.py'
      - 'docs/release/**'
      - 'RELEASE-TRUST.yaml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'STRUCTURE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Regenerate repository manifest
        run: python scripts/maintenance/repo_manifest.py --write
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- REPO-MANIFEST.sha256; then
            echo "repository manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPO-MANIFEST.sha256
          git commit -m "chore(release): refresh repository manifest"
          git push
