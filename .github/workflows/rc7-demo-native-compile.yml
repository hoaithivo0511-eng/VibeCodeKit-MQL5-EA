name: RC7 Demo Native Compile

on:
  push:
    branches:
      - 'test/rc7-native-compile-demo'
    paths:
      - 'demo/rc7/**'
      - '.github/workflows/rc7-demo-native-compile.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-compile:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MT5_DIR: C:\Program Files\MetaTrader 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Diagnostic install using proven MetaQuotes /auto semantics
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' `
            -OutFile "$env:RUNNER_TEMP\mt5setup.exe" -UseBasicParsing
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList '/auto' -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 10
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$env:MT5_DIR\MetaEditor64.exe")) {
            throw 'MetaEditor64.exe not found after installer'
          }
          Write-Host 'MetaEditor present despite installer process semantics'

      - name: Diagnostic 45-second terminal warmup and stdlib discovery
        shell: pwsh
        run: |
          $terminal = "$env:MT5_DIR\terminal64.exe"
          $p = Start-Process -FilePath $terminal -PassThru
          Start-Sleep -Seconds 45
          try { if (-not $p.HasExited) { $p.Kill($true) } } catch {}
          Start-Sleep -Seconds 5
          $hits = @(
            Get-ChildItem -Path "$env:APPDATA\MetaQuotes\Terminal",$env:MT5_DIR `
              -Filter Trade.mqh -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]MQL5[\\/]Include[\\/]Trade[\\/]Trade\.mqh$' }
          )
          Write-Host "Trade.mqh hits: $($hits.Count)"
          $hits | ForEach-Object { Write-Host "stdlib: $($_.FullName)" }
          if ($hits.Count -eq 0) { throw 'Trade.mqh not materialized after 45-second warmup' }

      - name: Compile demo EA with VibeCodeKit RC7 native action
        uses: ./.github/actions/mql5-native-compile
        with:
          target: Experts/RC7CompileDemo.mq5
          project-root: demo/rc7
          evidence-dir: evidence/compile
          metaeditor: C:\Program Files\MetaTrader 5\MetaEditor64.exe
          github-token: ${{ github.token }}
          expected-commit: ${{ github.sha }}
          warm-stdlib: never
          timeout-seconds: '180'
          kit-version: 3.3.0rc7

      - name: Validate RC7 GitHub compile evidence
        if: always()
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'tool/source/scripts'
          @'
          import json
          from pathlib import Path
          from vibecodekit_mql5.github_compile_evidence import validate_github_compile_record

          path = Path('demo/rc7/evidence/compile/result.json')
          if not path.is_file():
              raise SystemExit('missing demo/rc7/evidence/compile/result.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          result = validate_github_compile_record(payload)
          print(json.dumps(payload, indent=2))
          print(json.dumps(result.to_dict(), indent=2))
          if not result.ok:
              raise SystemExit(1)
          '@ | python -

      - name: Upload demo compile evidence and EX5
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rc7-demo-native-compile-${{ github.sha }}
          if-no-files-found: error
          path: demo/rc7/evidence/compile/
