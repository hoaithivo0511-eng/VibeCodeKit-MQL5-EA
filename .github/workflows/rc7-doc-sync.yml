name: RC7 Canonical Docs Sync

on:
  push:
    branches: ['hardening/rc7-audit-remediation']
    paths: ['.github/workflows/rc7-doc-sync.yml']

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/rc7-audit-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Synchronize VibecodeV5 and RC7 compile semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          guide_path = Path('tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md')
          text = guide_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '4. [Triết lý 8 bước & 2 lối đi](#4-triết-lý-8-bước--2-lối-đi)',
                  '4. [Quy trình VibecodeV5 10 bước & 2 lối đi](#4-quy-trình-vibecodev5-10-bước--2-lối-đi)',
              ),
              (
                  '9. [Remote worker — MetaEditor/MT5 thật trên Windows VPS](#9-remote-worker--metaeditormt5-thật-trên-windows-vps)',
                  '9. [Native backend — GitHub Actions & Windows worker](#9-native-backend--github-actions--windows-worker)',
              ),
              (
                  '## 4. Triết lý 8 bước & 2 lối đi\n\nVòng đời build EA gồm **8 bước**: `SCAN → RRI → VISION → BLUEPRINT → TIP →\nBUILD → VERIFY → REFINE/SHIP`. Golden flow khi vận hành:',
                  '## 4. Quy trình VibecodeV5 10 bước & 2 lối đi\n\nVòng đời canonical gồm **10 bước**: `SCAN → RRI → SPECIFY → DECIDE → CONTRACT →\nPLAN → BUILD → VERIFY → EVIDENCE → RETRO`. `VERIFY` phải giữ nguyên trạng thái\n`FAIL / UNTESTABLE / SKIPPED` khi thiếu bằng chứng; `EVIDENCE` liên kết kết quả với\nhash source, artifact và môi trường thay vì suy diễn PASS. Golden flow khi vận hành:',
              ),
              (
                  '| `chu-nha` | Chủ nhà (người vận hành) | SCAN, VISION, APPROVED, CONFIRM, REFINE |\n| `chu-thau` | Thầu (Claude/GPT/Cursor Ask) | VISION design, BLUEPRINT, CONTRACT, TASK-GRAPH, VERIFY-REPORT |\n| `tho-thi-cong` | Thợ (Claude Code/Devin/Cursor Edit) | SCAN exec, TIP, BUILD, VERIFY |',
                  '| `chu-nha` | Chủ nhà (người vận hành) | SPECIFY/DECIDE các semantics, duyệt thay đổi và RETRO outcome |\n| `chu-thau` | Thầu (Claude/GPT/Cursor Ask) | SCAN/RRI, CONTRACT, PLAN, independent VERIFY/EVIDENCE review |\n| `tho-thi-cong` | Thợ (Claude Code/Devin/Cursor Edit) | BUILD theo contract đã duyệt và chạy focused VERIFY |',
              ),
              (
                  '## 9. Remote worker — MetaEditor/MT5 thật trên Windows VPS\n\nDùng Windows worker để chạy MetaEditor/MT5 thật thay vì stub.',
                  '## 9. Native backend — GitHub Actions & Windows worker\n\nRC7 có ba đường native đáng tin cậy khi provenance hợp lệ: MetaEditor Windows local,\nGitHub Actions Windows và Windows remote worker. Wine vẫn là backend development/CI\ntheo mặc định và không tự trở thành release authority.',
              ),
              (
                  '**Permission layer 2 fail trên Linux không Wine** → đúng hành vi (gate không\nlặng lẽ skip compile). Cài Wine hoặc dùng remote worker (§9).',
                  '**Permission layer 2 fail vì không có compile backend** → đúng hành vi (gate không\nlặng lẽ skip compile). Cấu hình Windows local, GitHub Actions native, remote worker\nhoặc Wine development; nếu không có backend thì giữ `UNTESTABLE` (§5.6, §9).',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing canonical guide anchor: {old[:100]!r}')
              text = text.replace(old, new, 1)

          old_compile = '''Điều kiện: có MetaEditor (build ≥ 5260) qua Wine/native, hoặc remote worker (§9).\n\n```bash\nmql5-compile-runner --ea Experts/MyEA.mq5 --out evidence/compile\n# dry-run chỉ để test flow (KHÔNG tạo release):\nmql5-compile-runner --ea Experts/MyEA.mq5 --dry-run\n```'''
          new_compile = '''Canonical surface là `vkmql-check compile` / `mql5-compile`. Với `--backend auto`,\nkit ưu tiên **Windows native local → GitHub Actions Windows → remote Windows worker\n→ Wine development**. Nếu không có backend hợp lệ, kết quả phải là `UNTESTABLE`.\n\n```bash\n# Canonical compile; tự chọn backend tốt nhất đã cấu hình\nmql5-compile Experts/MyEA.mq5 --backend auto --project-root . --out evidence/compile\n\n# Ép GitHub Actions native khi cần provenance theo exact commit\nexport VKMQL_GITHUB_TOKEN=...\nmql5-compile Experts/MyEA.mq5 --backend github-actions --project-root . \\\n  --github-repo OWNER/REPO --github-ref BRANCH --github-commit <40-char-sha> \\\n  --out evidence/compile\n```\n\n`mql5-compile-runner` được giữ như **compatibility/evidence wrapper** (và remote-worker\nadapter), không phải compile surface mặc định cho workflow mới. Wine compile chỉ là\ndevelopment/CI evidence trừ khi policy dự án nói rõ khác. Native compile PASS vẫn\nkhông thay thế Strategy Tester, restart/recovery, broker parity, forward hoặc live gate.'''
          if old_compile not in text:
              raise SystemExit('missing §5.6 compile anchor')
          text = text.replace(old_compile, new_compile, 1)

          remote_anchor = '''### Compile / backtest remote\n\n```bash\nmql5-compile-runner --ea workspace/MyEA/Experts/MyEA.mq5 \\\n  --backend remote-worker --worker-url http://WINDOWS_WORKER:8787 \\\n  --worker-token CHANGE_ME --out workspace/MyEA/evidence/compile\n'''
          remote_new = '''### GitHub Actions native compile\n\nGitHub backend chỉ được trust khi validator chứng minh đúng repository, exact source\ncommit/tree, correlated workflow run + numeric job id, Windows runner, ProbeEA,\n`0 errors, 0 warnings`, EX5 vật lý và hash/size artifact. Không trust chỉ vì manifest\nchứa chuỗi `github_actions_metaeditor`.\n\n```bash\nexport VKMQL_GITHUB_TOKEN=...\nmql5-compile workspace/MyEA/Experts/MyEA.mq5 --backend github-actions \\\n  --project-root workspace/MyEA --github-repo OWNER/REPO --github-ref BRANCH \\\n  --github-commit <40-char-sha> --out workspace/MyEA/evidence/compile\n```\n\n### Compile / backtest remote worker\n\n```bash\nmql5-compile workspace/MyEA/Experts/MyEA.mq5 --backend remote-worker \\\n  --project-root workspace/MyEA --worker-url http://WINDOWS_WORKER:8787 \\\n  --worker-token CHANGE_ME --out workspace/MyEA/evidence/compile\n'''
          if remote_anchor not in text:
              raise SystemExit('missing §9 remote compile anchor')
          text = text.replace(remote_anchor, remote_new, 1)

          evidence_anchor = '''- Có `evidence/manifest.json` với `release_eligible=true` + hash artifact\n  (compile log hash, EX5 hash, backtest/gate report hash khi cần release)\n\n**Không tin** bất kỳ claim'''
          evidence_new = '''- Có `evidence/manifest.json` với `release_eligible=true` + hash artifact\n  (compile log hash, EX5 hash, backtest/gate report hash khi cần release)\n- Với GitHub native compile: provenance phải bind đúng repository + exact source\n  commit/tree + workflow run/job Windows + ProbeEA + `0 errors, 0 warnings` + EX5/hash.\n- Native compile PASS **không** tự nâng Strategy Tester, restart/recovery, broker,\n  forward-test hay live gate; từng gate phải có evidence độc lập.\n\n**Không tin** bất kỳ claim'''
          if evidence_anchor not in text:
              raise SystemExit('missing §14 evidence anchor')
          text = text.replace(evidence_anchor, evidence_new, 1)

          # Keep the capability summary aligned with the canonical backend hierarchy.
          old_cap = '- **Compile** qua MetaEditor/MT5 (Wine trên Linux, native trên Windows).'
          new_cap = '- **Compile** qua canonical backend: Windows local → GitHub Actions Windows → remote Windows → Wine development.'
          if old_cap not in text:
              raise SystemExit('missing capability compile anchor')
          text = text.replace(old_cap, new_cap, 1)

          guide_path.write_text(text, encoding='utf-8')

          status_path = Path('docs/release/v3.3.0rc7/RC7-CANDIDATE-STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          old_status = 'A fresh exact-candidate native compile remains required after remediation.'
          new_status = 'Mỗi remediation candidate phải có native evidence mới bind đúng exact candidate/PR source trước merge; historical smoke này không được tái sử dụng như bằng chứng cho source khác.'
          if old_status not in status:
              raise SystemExit('missing RC7 status provenance anchor')
          status_path.write_text(status.replace(old_status, new_status, 1), encoding='utf-8')
          PY
      - name: Verify canonical documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SCAN → RRI → SPECIFY → DECIDE → CONTRACT' tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md
          grep -F 'github-actions' tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md
          grep -F 'Windows native local → GitHub Actions Windows → remote Windows worker' tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md
          python scripts/maintenance/check_duplicate_content.py
          python scripts/maintenance/check_rc6_hygiene.py
      - name: Remove bootstrap and bind manifest to final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rc7-doc-sync.yml
          python scripts/maintenance/repo_manifest.py --write
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tool/source/docs/HUONG-DAN-TOAN-TAP-vi.md docs/release/v3.3.0rc7/RC7-CANDIDATE-STATUS.md REPO-MANIFEST.sha256
          git commit -m 'docs(rc7): align canonical guide with VibecodeV5 backends'
          git push origin HEAD:hardening/rc7-audit-remediation
