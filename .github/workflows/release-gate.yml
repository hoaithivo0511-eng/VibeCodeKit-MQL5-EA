name: RC4 Release Gate

on:
  push:
    branches:
      - main
      - 'release-prep/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tool/source/pyproject.toml
      - name: Install source + dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install './tool/source[dev]'
      - name: Source regression
        working-directory: tool/source
        run: python -m pytest -q
      - name: Source selftest
        run: python -m vibecodekit_mql5.selftest

  artifact-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify fixed RC4 artifact hashes
        shell: bash
        run: |
          test "$(sha256sum VibecodeKit-MQL5-v3.3.0rc4-runtime-safety-fix-bundle.zip | awk '{print $1}')" = "33af7e8326f6e373de6366600b35e7a5b465b5aee34f24af07f2ac6e36deec6c"
          test "$(sha256sum tool/vibecodekit-mql5-v3.3.0rc4-source-full.zip | awk '{print $1}')" = "a8e091caf35b59fbf436d10c5c8e1dc0414d3e355d029162295192c02029566f"
          test "$(sha256sum tool/vibecodekit_mql5_ea-3.3.0rc4-py3-none-any.whl | awk '{print $1}')" = "5945a91c9f2b74ee3bbe3a7977991445d3e95885e396c3f95a14262ac8eb127a"
      - name: Verify expanded source is byte-identical to source ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path('tool/vibecodekit-mql5-v3.3.0rc4-source-full.zip')
          expanded = Path('tool/source')
          with zipfile.ZipFile(archive) as zf:
              members = sorted(i.filename for i in zf.infolist() if not i.is_dir())
              disk = sorted(str(p.relative_to(expanded)).replace('\\', '/') for p in expanded.rglob('*') if p.is_file())
              if members != disk:
                  missing = sorted(set(members) - set(disk))
                  extra = sorted(set(disk) - set(members))
                  raise SystemExit(f'source tree mismatch: missing={missing[:10]} extra={extra[:10]}')
              for name in members:
                  if zf.read(name) != (expanded / name).read_bytes():
                      raise SystemExit(f'byte mismatch: {name}')
          print(f'expanded source parity: PASS ({len(members)} files)')
          PY
      - name: Wheel selftest
        run: |
          python -m pip install --upgrade pip
          python -m pip install tool/vibecodekit_mql5_ea-3.3.0rc4-py3-none-any.whl
          mql5-selftest

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked release hygiene
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath, Path
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden_exact = {
              'chatgpt-write-smoke.txt',
              'PUSH-GUIDE.md',
              'SETUP-CODESPACE.sh',
          }
          forbidden_segments = {
              '__pycache__', '.pytest_cache', '.mypy_cache', '.ruff_cache',
              '.venv', 'venv', 'node_modules', 'htmlcov',
          }
          forbidden_basenames = {'.DS_Store', 'Thumbs.db', '.coverage', '.env'}

          bad = []
          for path in tracked:
              p = PurePosixPath(path)
              is_generated_coverage_json = p.name == 'coverage.json' and (not p.parts or p.parts[0] != 'reports')
              if (
                  path in forbidden_exact
                  or any(seg in forbidden_segments for seg in p.parts)
                  or p.name in forbidden_basenames
                  or is_generated_coverage_json
              ):
                  bad.append(path)

          required = [
              '.gitignore', 'LICENSE', 'README.md', 'STRUCTURE.md',
              'docs/release/v3.3.0rc4/RELEASE-PREP-PLAN.md',
              'docs/maintenance/INITIAL-IMPORT.md',
              'scripts/maintenance/import-release-bundle.sh',
          ]
          missing = [path for path in required if path not in tracked or not Path(path).is_file()]
          print(f'tracked files checked: {len(tracked)}')
          print(f'forbidden tracked files: {bad}')
          print(f'missing required files: {missing}')
          if bad or missing:
              raise SystemExit(1)
          print('repository hygiene: PASS')
          PY
