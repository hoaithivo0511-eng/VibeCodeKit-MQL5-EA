name: RC4 Release Gate

on:
  push:
    branches:
      - main
      - 'release-prep/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tool/source/pyproject.toml
      - name: Install source + complete test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install './tool/source[dev]' 'reportlab>=4'
      - name: Source regression + coverage
        working-directory: tool/source
        run: |
          python -m pytest -q \
            --junitxml=/tmp/source-junit.xml \
            --cov=vibecodekit_mql5 \
            --cov-report=term \
            --cov-report=json:/tmp/source-coverage.json
      - name: Enforce 126 tests with zero skip/fail/error
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/source-junit.xml').getroot()
          suites = list(root.findall('testsuite')) if root.tag == 'testsuites' else [root]
          counts = {k: sum(int(s.attrib.get(k, 0)) for s in suites) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('source junit:', counts)
          if counts != {'tests': 126, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('source suite must be exactly 126 PASS with no skips')
          cov = json.load(open('/tmp/source-coverage.json', encoding='utf-8'))
          print(f"source coverage total: {cov['totals']['percent_covered']:.2f}%")
          PY
      - name: Source selftest
        run: python -m vibecodekit_mql5.selftest

  source-archive-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Safely extract canonical source archive
        run: |
          rm -rf /tmp/vkmql-source-zip
          mkdir -p /tmp/vkmql-source-zip
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          archive = Path('tool/vibecodekit-mql5-v3.3.0rc4-source-full.zip')
          target = Path('/tmp/vkmql-source-zip')
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  p = PurePosixPath(info.filename.replace('\\', '/'))
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe source archive member: {info.filename}')
              zf.extractall(target)
          print('source archive extraction: PASS')
          PY
      - name: Install archive + complete test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '/tmp/vkmql-source-zip[dev]' 'reportlab>=4'
      - name: Fresh source archive regression
        working-directory: /tmp/vkmql-source-zip
        run: python -m pytest -q --junitxml=/tmp/archive-junit.xml
      - name: Enforce archive 126 tests with zero skip/fail/error
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/archive-junit.xml').getroot()
          suites = list(root.findall('testsuite')) if root.tag == 'testsuites' else [root]
          counts = {k: sum(int(s.attrib.get(k, 0)) for s in suites) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('archive junit:', counts)
          if counts != {'tests': 126, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('source archive suite must be exactly 126 PASS with no skips')
          PY
      - name: Source archive selftest
        working-directory: /tmp/vkmql-source-zip
        run: python -m vibecodekit_mql5.selftest

  wheel-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install wheel + test-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=7.4' 'pytest-cov>=4.1' 'ruff>=0.1' 'reportlab>=4'
          python -m pip install tool/vibecodekit_mql5_ea-3.3.0rc4-py3-none-any.whl
      - name: Prepare tests outside source checkout
        run: |
          rm -rf /tmp/vkmql-wheel-tests
          mkdir -p /tmp/vkmql-wheel-tests
          cp -R tool/source/tests/. /tmp/vkmql-wheel-tests/
      - name: Installed wheel regression
        working-directory: /tmp/vkmql-wheel-tests
        env:
          PYTHONPATH: ''
        run: python -m pytest -q --junitxml=/tmp/wheel-junit.xml
      - name: Enforce wheel 126 tests with zero skip/fail/error
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/wheel-junit.xml').getroot()
          suites = list(root.findall('testsuite')) if root.tag == 'testsuites' else [root]
          counts = {k: sum(int(s.attrib.get(k, 0)) for s in suites) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('wheel junit:', counts)
          if counts != {'tests': 126, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('wheel suite must be exactly 126 PASS with no skips')
          PY
      - name: Wheel selftest
        working-directory: /tmp
        env:
          PYTHONPATH: ''
        run: mql5-selftest

  artifact-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify fixed RC4 artifact hashes
        shell: bash
        run: |
          test "$(sha256sum VibecodeKit-MQL5-v3.3.0rc4-runtime-safety-fix-bundle.zip | awk '{print $1}')" = "33af7e8326f6e373de6366600b35e7a5b465b5aee34f24af07f2ac6e36deec6c"
          test "$(sha256sum tool/vibecodekit-mql5-v3.3.0rc4-source-full.zip | awk '{print $1}')" = "a8e091caf35b59fbf436d10c5c8e1dc0414d3e355d029162295192c02029566f"
          test "$(sha256sum tool/vibecodekit_mql5_ea-3.3.0rc4-py3-none-any.whl | awk '{print $1}')" = "5945a91c9f2b74ee3bbe3a7977991445d3e95885e396c3f95a14262ac8eb127a"
      - name: Verify expanded source is byte-identical to source ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path('tool/vibecodekit-mql5-v3.3.0rc4-source-full.zip')
          expanded = Path('tool/source')
          with zipfile.ZipFile(archive) as zf:
              members = sorted(i.filename for i in zf.infolist() if not i.is_dir())
              disk = sorted(str(p.relative_to(expanded)).replace('\\', '/') for p in expanded.rglob('*') if p.is_file())
              if members != disk:
                  missing = sorted(set(members) - set(disk))
                  extra = sorted(set(disk) - set(members))
                  raise SystemExit(f'source tree mismatch: missing={missing[:10]} extra={extra[:10]}')
              for name in members:
                  if zf.read(name) != (expanded / name).read_bytes():
                      raise SystemExit(f'byte mismatch: {name}')
          print(f'expanded source parity: PASS ({len(members)} files)')
          PY
      - name: Verify root/package license parity
        run: cmp --silent LICENSE tool/source/LICENSE && echo 'license parity: PASS'

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked release hygiene
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath, Path
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden_exact = {
              'chatgpt-write-smoke.txt',
              'PUSH-GUIDE.md',
              'SETUP-CODESPACE.sh',
          }
          forbidden_segments = {
              '__pycache__', '.pytest_cache', '.mypy_cache', '.ruff_cache',
              '.venv', 'venv', 'node_modules', 'htmlcov',
          }
          forbidden_basenames = {'.DS_Store', 'Thumbs.db', '.coverage', '.env'}

          bad = []
          for path in tracked:
              p = PurePosixPath(path)
              is_generated_coverage_json = p.name == 'coverage.json' and (not p.parts or p.parts[0] != 'reports')
              if (
                  path in forbidden_exact
                  or any(seg in forbidden_segments for seg in p.parts)
                  or p.name in forbidden_basenames
                  or is_generated_coverage_json
              ):
                  bad.append(path)

          required = [
              '.gitignore', 'LICENSE', 'README.md', 'STRUCTURE.md',
              'docs/release/v3.3.0rc4/RELEASE-PREP-PLAN.md',
              'docs/maintenance/INITIAL-IMPORT.md',
              'scripts/maintenance/import-release-bundle.sh',
          ]
          missing = [path for path in required if path not in tracked or not Path(path).is_file()]
          print(f'tracked files checked: {len(tracked)}')
          print(f'forbidden tracked files: {bad}')
          print(f'missing required files: {missing}')
          if bad or missing:
              raise SystemExit(1)
          print('repository hygiene: PASS')
          PY
