name: One-shot Tag v3.3.0rc4

on:
  push:
    branches:
      - 'release-prep/v3.3.0rc4'
    paths:
      - '.github/workflows/tag-v3.3.0rc4-once.yml'

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify main target and create annotated tag
        env:
          TARGET_SHA: '2e6b2c7d76d49e7a3c23d0bc737acdec6a1239ed'
          TAG_NAME: 'v3.3.0rc4'
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "main moved: expected $TARGET_SHA, got $MAIN_SHA" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "tag already exists: $TAG_NAME" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "VibeCodeKit MQL5 v3.3.0rc4 pre-release candidate"
          git push origin "refs/tags/$TAG_NAME"
