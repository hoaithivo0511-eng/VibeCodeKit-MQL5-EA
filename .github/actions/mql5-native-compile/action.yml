name: VibeCodeKit MQL5 Native Compile
description: Compile one or more MQL5 targets with native Windows MetaEditor and emit provenance-bound evidence.
inputs:
  target:
    description: Primary .mq5 target relative to project-root.
    required: true
  targets-json:
    description: Optional JSON array of additional/alternative targets ({id,source,required}).
    required: false
    default: ''
  project-root:
    description: Project root containing MQL5/, Experts/Include/etc, or a self-contained source tree.
    required: false
    default: '.'
  evidence-dir:
    description: Evidence directory relative to project-root.
    required: false
    default: 'evidence/compile'
  metaeditor:
    description: Optional existing MetaEditor64.exe path. If omitted, installer-url is used.
    required: false
    default: ''
  installer-url:
    description: HTTPS MT5 installer URL used when metaeditor is not supplied.
    required: false
    default: ''
  installer-sha256:
    description: Optional pinned SHA-256 for the downloaded MT5 installer.
    required: false
    default: ''
  github-token:
    description: GitHub token used only to resolve the numeric workflow job id for provenance.
    required: false
    default: ''
  expected-commit:
    description: Optional full commit SHA that the checked-out source must match.
    required: false
    default: ''
  warm-stdlib:
    description: auto, always, or never. Auto warms terminal only for angle includes and verifies Trade/Trade.mqh before compile.
    required: false
    default: 'auto'
  timeout-seconds:
    description: Per-target MetaEditor timeout.
    required: false
    default: '180'
  kit-version:
    description: VibeCodeKit version recorded in compile provenance.
    required: false
    default: '3.3.0rc7'
runs:
  using: composite
  steps:
    - name: Prepare MetaEditor and MQL5 standard library
      id: prepare-toolchain
      shell: pwsh
      env:
        VKMQL_TARGET: ${{ inputs.target }}
        VKMQL_TARGETS_JSON: ${{ inputs.targets-json }}
        VKMQL_PROJECT_ROOT: ${{ inputs.project-root }}
        VKMQL_METAEDITOR: ${{ inputs.metaeditor }}
        VKMQL_INSTALLER_URL: ${{ inputs.installer-url }}
        VKMQL_INSTALLER_SHA256: ${{ inputs.installer-sha256 }}
        VKMQL_WARM_STDLIB: ${{ inputs.warm-stdlib }}
      run: |
        & "${{ github.action_path }}/Prepare-VKMql5Toolchain.ps1" `
          -MetaEditor $env:VKMQL_METAEDITOR `
          -InstallerUrl $env:VKMQL_INSTALLER_URL `
          -InstallerSha256 $env:VKMQL_INSTALLER_SHA256 `
          -ProjectRoot $env:VKMQL_PROJECT_ROOT `
          -Target $env:VKMQL_TARGET `
          -TargetsJson $env:VKMQL_TARGETS_JSON `
          -WarmStdlib $env:VKMQL_WARM_STDLIB

    - name: Native MetaEditor compile
      shell: pwsh
      env:
        VKMQL_TARGET: ${{ inputs.target }}
        VKMQL_TARGETS_JSON: ${{ inputs.targets-json }}
        VKMQL_PROJECT_ROOT: ${{ inputs.project-root }}
        VKMQL_EVIDENCE_DIR: ${{ inputs.evidence-dir }}
        VKMQL_METAEDITOR: ${{ steps.prepare-toolchain.outputs.metaeditor }}
        VKMQL_GITHUB_TOKEN: ${{ inputs.github-token }}
        VKMQL_EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        VKMQL_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        VKMQL_KIT_VERSION: ${{ inputs.kit-version }}
      run: |
        & "${{ github.action_path }}/Invoke-VKMql5Compile.ps1" `
          -Target $env:VKMQL_TARGET `
          -TargetsJson $env:VKMQL_TARGETS_JSON `
          -ProjectRoot $env:VKMQL_PROJECT_ROOT `
          -EvidenceDir $env:VKMQL_EVIDENCE_DIR `
          -MetaEditor $env:VKMQL_METAEDITOR `
          -InstallerUrl '' `
          -InstallerSha256 '' `
          -GitHubToken $env:VKMQL_GITHUB_TOKEN `
          -ExpectedCommit $env:VKMQL_EXPECTED_COMMIT `
          -WarmStdlib never `
          -TimeoutSeconds ([int]$env:VKMQL_TIMEOUT_SECONDS) `
          -KitVersion $env:VKMQL_KIT_VERSION

    - name: Finalize prepared toolchain provenance
      if: always()
      shell: pwsh
      env:
        VKMQL_PROJECT_ROOT: ${{ inputs.project-root }}
        VKMQL_EVIDENCE_DIR: ${{ inputs.evidence-dir }}
        VKMQL_INSTALLER_SHA256: ${{ steps.prepare-toolchain.outputs.installer_sha256 }}
        VKMQL_STDLIB_WARMED: ${{ steps.prepare-toolchain.outputs.stdlib_warmed }}
      run: |
        & "${{ github.action_path }}/Finalize-VKMql5ToolchainEvidence.ps1" `
          -ProjectRoot $env:VKMQL_PROJECT_ROOT `
          -EvidenceDir $env:VKMQL_EVIDENCE_DIR `
          -InstallerSha256 $env:VKMQL_INSTALLER_SHA256 `
          -StdlibWarmed $env:VKMQL_STDLIB_WARMED
