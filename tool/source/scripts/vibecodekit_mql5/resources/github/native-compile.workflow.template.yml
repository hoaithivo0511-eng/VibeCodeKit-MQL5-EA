name: VibeCodeKit MQL5 Native Compile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # SECURITY: replace <PINNED_VKMQL_COMMIT_SHA> with a reviewed 40-char
      # commit SHA from VibeCodeKit-MQL5-EA. Do not pin release evidence to a
      # floating branch/tag.
      - name: Compile MQL5 target with native MetaEditor
        uses: hoaithivo0511-eng/VibeCodeKit-MQL5-EA/.github/actions/mql5-native-compile@<PINNED_VKMQL_COMMIT_SHA>
        with:
          target: MQL5/Experts/MyEA/MyEA.mq5
          project-root: .
          evidence-dir: evidence/compile
          installer-url: ${{ secrets.MT5_INSTALLER_URL }}
          installer-sha256: ${{ secrets.MT5_INSTALLER_SHA256 }}
          github-token: ${{ github.token }}
          expected-commit: ${{ github.sha }}
          warm-stdlib: auto

      - name: Upload native compile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vkmql-native-compile-${{ github.sha }}
          if-no-files-found: error
          path: evidence/compile/
