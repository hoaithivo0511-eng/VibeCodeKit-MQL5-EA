[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools.package-data]
# Ship runtime assets inside the wheel so the kit works without the source
# checkout (scaffolds, Include headers, profiles, RRI step templates).
vibecodekit_mql5 = [
    "resources/**/*",
    "resources/**/.gitkeep",
    # EA documentation renderer assets (CSS + pixel-art SVG icons). Loaded at
    # runtime via ea_docs_render.ASSETS_DIR (Path(__file__).parent /
    # "ea_docs_assets"); must ship inside the wheel or the docs stage fails
    # after `pip install` with "No such file or directory: .../ea_docs_assets/style.css".
    "ea_docs_assets/**/*",
]

[tool.pytest.ini_options]
# Make `pytest -q` work straight from the repo root after unzip, without
# requiring `PYTHONPATH=scripts`. The package lives under scripts/.
pythonpath = ["scripts", "tests"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
