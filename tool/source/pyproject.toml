[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecodekit-mql5-ea"
version = "3.3.0rc5"
description = "Vibecode methodology kit for MQL5 Expert Advisor development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "vibecodekit-mql5-ea contributors"}]

dependencies = [
    # Keep minimal; add extras as needed.
    # PyYAML lives in core because `mql5-auto-build` accepts a YAML spec by
    # default and the documented quickstart pipes `mql5-spec-from-prompt`
    # YAML output straight into it; without PyYAML the first chat-driven
    # build after a fresh `pip install -e .` fails on `load_spec`.
    "pyyaml>=6.0",
    # Ed25519 verification of native-runner release attestations. Core, not
    # optional: without it the release gate cannot check its own trust root.
    "cryptography>=42",
    # LLM-driven .docx ship pipeline (`mql5-docs-bundle` emits the LLM
    # context + prompt; `mql5-docs-assemble` converts the LLM-authored
    # `guide.md` to a Word document for the ship.zip). Both deps are
    # pure-Python wheels so they install cleanly on Linux/Wine/Windows
    # without extra system packages.
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # PDF-ingest regression is part of the mandatory source/wheel suite.
    # Keep ReportLab in the declared dev surface so `pip install -e .[dev]`
    # cannot silently turn that test into an importorskip.
    "reportlab>=4",
    "ruff>=0.1",
]
ml = [
    # ML extras: ONNX/PyTorch/etc
    "onnx>=1.14",
    "torch>=2.0",
    "MetaTrader5>=5.0.45",
]

[project.scripts]
mql5-ea-deep-review = "vibecodekit_mql5.deep_review:main"
mql5-ea-audit = "vibecodekit_mql5.deep_review:main"
